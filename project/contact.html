<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <meta name="description" content="Information about how to contact the incourageclub.">
    <meta name="author" content="Aaron Andrei M">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz@0,9..40;1,9..40&display=swap"
        rel="stylesheet">
    <script src="scripts/incourage.js" defer></script>
</head>

<body>
    <header class="header">
        <div class="logo-container">
            <a href="index.html"><img src="images/incourage-logo-transparent-white.svg" alt="incourage club logo"
                    class="logo"></a>
        </div>
        <!-- <span class="site-name">we are incourage</span> -->
        <nav>
            <ul class="nav-links">
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="#blog">Blog</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <p></p>
        <section class="contact-form">
            <h2>Contact</h2>
            <h3>Please fill out all fields and we will reach out soon.</h3>
            <form action="#" method="get">
                <label for="first-name">First Name:</label>
                <input type="text" id="first-name" name="first-name" required>

                <label for="last-name">Last Name:</label>
                <input type="text" id="last-name" name="last-name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message:</label>
                <textarea name="message" id="message" rows="4"></textarea>

                <input type="submit" value="Send my Information">
            </form>
        </section>
    </main>
    <footer>
        <p>
            <span id="currentYear">&copy;2000</span> | incourage club
        </p>
    </footer>
</body>

</html>
