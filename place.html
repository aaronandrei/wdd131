<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medellin Colombia</title>
    <meta name="description" content="Information about Medellin, Colombia where I served my mission for two years.">
    <meta name="author" content="Aaron Andrei M">
    <link rel="stylesheet" href="styles/place.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Funnel+Display&display=swap" rel="stylesheet">
    <script src="scripts/place.js" defer></script>
</head>

<body>
    <header>
        <h1>Medellín</h1>
    </header>
    <main>
        <picture>
            <source srcset="images/medellin-large.webp" media="(min-width: 750px)">
            <img src="images/medellin-small.webp" alt="View of Medellin Skyscrapers">
        </picture>
        <section class="databox">
            <h2>Data</h2>
            <div class="table">
                <span class="label">Area:</span><span class="value">445 sq mi</span>
                <span class="label">Population:</span><span class="value">3,731,447</span>
                <span class="label">Country:</span><span class="value">Colombia</span>
                <span class="label">Language:</span><span class="value">Spanish</span>
                <span class="label">Currency:</span><span class="value">Colombian Peso</span>
                <span class="label">Time Zone:</span><span class="value">UTC-05:00</span>
                <span class="label">Calling Code:</span><span class="value">+57</span>
                <span class="label">Internet TLD:</span><span class="value">.co</span>
            </div>
        </section>
        <section class="weatherbox">
            <h2>Weather</h2>
            <div class="table">
                <span class="label">Temperature:</span><span class="value">70°F</span>
                <span class="label">Conditions:</span><span class="value">Rainy</span>
                <span class="label">Wind:</span><span class="value">2mph</span>
                <span class="label">Wind Chill:</span><span class="value"></span>
            </div>
        </section>
    </main>
    <footer>
        <p>
            <span id="currentYear">&copy;2025</span> | Aaron Andrei M | USA
        </p>
        <p class="highlight" id="lastModified">Last Modification: 01/13/2025 09:48:00</p>
    </footer>
</body>

</html>
